<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>LaLiDa - Quản trị</title>
  <meta name="theme-color" content="#3b512a" />
  <link rel="icon" href="/assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="/assets/tailwind-config.js?v=20261026a"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }
    .input { width: 100%; border: 1px solid #d6d3d1; border-radius: .5rem; padding: .5rem .75rem; background: #fff; }
    .input:focus { outline: none; box-shadow: 0 0 0 2px #5f8241; }
    .btn { border-radius: .6rem; padding: .5rem 1rem; font-weight: 600; font-size: .875rem; transition: background-color .15s; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: #3b512a; color: #fff; } .btn-primary:hover { background: #304124; }
    .btn-accent { background: #c9762f; color: #fff; } .btn-accent:hover { background: #a95f22; }
    .btn-ghost { background: #fff; color: #304124; border: 1px solid #c7d7b4; } .btn-ghost:hover { background: #f3f6ef; }
    .btn-danger { background: #fff; color: #b91c1c; border: 1px solid #fecaca; } .btn-danger:hover { background: #fef2f2; }
    .card { background: #fff; border: 1px solid #efe2c4; border-radius: 1rem; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .tbl th { text-align: left; font-weight: 600; font-size: .75rem; text-transform: uppercase; color: #78716c; padding: .5rem; border-bottom: 1px solid #e7e5e4; }
    .tbl td { padding: .5rem; border-bottom: 1px solid #f5f5f4; vertical-align: top; }

    /* ===== IN ẤN: hoá đơn nhiệt 58/80mm & tờ QR ===== */
    #print-area { display: none; }
    @media print {
      body > *:not(#print-area) { display: none !important; }
      #print-area { display: block !important; }
      body { background: #fff !important; }
    }
    .bill { font-family: 'Courier New', monospace; color: #000; font-size: 12px; line-height: 1.35; padding: 2mm 3mm; }
    .bill.w58 { width: 58mm; font-size: 11px; } .bill.w80 { width: 80mm; }
    .bill .c { text-align: center; } .bill .r { text-align: right; } .bill .b { font-weight: 700; }
    .bill hr { border: 0; border-top: 1px dashed #000; margin: 4px 0; }
    .bill table { width: 100%; border-collapse: collapse; } .bill td { padding: 1px 0; vertical-align: top; }
    .bill img { width: 70%; max-width: 46mm; margin: 0 auto 2px; display: block; filter: grayscale(1) contrast(1.4); }
    .qr-sheet { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10mm; padding: 8mm; }
    .qr-card { border: 2px dashed #3b512a; border-radius: 6mm; padding: 6mm; text-align: center; break-inside: avoid; font-family: 'Be Vietnam Pro', sans-serif; }
    .qr-card img.logo { height: 22mm; margin: 0 auto 2mm; }
    .qr-card .qr { display: flex; justify-content: center; margin: 3mm 0; }
  </style>
</head>
<body class="bg-cream-50 text-stone-800 font-sans min-h-screen">

  <!-- ĐĂNG NHẬP -->
  <section id="login-view" class="hidden min-h-screen flex items-center justify-center p-4">
    <form id="login-form" class="card w-full max-w-sm p-6 space-y-4">
      <img src="/assets/logo.webp" alt="LaLiDa - Gà ba nuôi - Cơm mẹ nấu" class="h-24 mx-auto" />
      <h1 class="text-center font-bold text-lg text-brand-800">🔐 Đăng nhập quản trị</h1>
      <div>
        <label for="login-password" class="block text-sm font-medium mb-1">Mật khẩu Admin</label>
        <input id="login-password" type="password" autocomplete="current-password" required class="input" />
      </div>
      <button class="btn btn-primary w-full py-3">Đăng nhập</button>
      <p id="login-error" class="text-sm text-red-600 text-center"></p>
    </form>
  </section>

  <!-- ỨNG DỤNG QUẢN TRỊ -->
  <div id="app-view" class="hidden">
    <header class="sticky top-0 z-30 bg-cream-100/95 backdrop-blur border-b border-cream-200 shadow-sm">
      <div class="max-w-7xl mx-auto px-4 flex items-center gap-3 py-2">
        <img src="/assets/logo.webp" alt="LaLiDa - Gà ba nuôi - Cơm mẹ nấu" class="h-14 w-auto" />
        <div class="hidden sm:block">
          <div class="font-bold text-brand-800 leading-tight">Quản lý quán</div>
          <div class="text-xs text-stone-500">Bếp · Thu ngân · Báo cáo</div>
        </div>
        <div class="ml-auto flex items-center gap-2">
          <span id="live-dot" class="hidden sm:inline-flex items-center gap-1 text-xs text-emerald-700"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>Realtime</span>
          <button id="logout-btn" class="btn btn-ghost">Đăng xuất</button>
        </div>
      </div>
      <nav class="max-w-7xl mx-auto px-2">
        <div id="nav" class="flex gap-1 overflow-x-auto no-scrollbar py-2"></div>
      </nav>
    </header>
    <main id="view" class="max-w-7xl mx-auto px-4 py-5"></main>
  </div>

  <!-- MODAL -->
  <div id="modal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between px-5 py-3 border-b border-stone-100 sticky top-0 bg-white">
        <h3 id="modal-title" class="font-bold text-brand-800"></h3>
        <button id="modal-close" class="text-2xl text-stone-400 hover:text-stone-700" aria-label="Đóng">×</button>
      </div>
      <div id="modal-body" class="p-5"></div>
    </div>
  </div>

  <!-- VÙNG IN -->
  <div id="print-area"></div>

  <script src="/assets/common.js?v=20261026a"></script>
  <script src="/assets/printer.js?v=20261026a"></script>
  <script src="/assets/admin.js?v=20261026a"></script>
</body>
</html>
